name: PhaseGate Native Windows EXE

on:
  push:
    branches:
      - main
      - "feature/native-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-executable:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout DPN PhaseGate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Qt Widgets and EXE bundler
        run: python -m pip install -r desktop/requirements.txt
      - name: Validate scientific records, Python tests and documentation
        run: |
          python tools/validate_research.py
          python -m unittest discover -s tests -v
          python tools/export_pg01_build_pack.py --check
          python tools/export_pg01_inspection_drawings.py --check
          python tools/validate_readme.py
      - name: Compile Pico 2 MicroPython firmware syntax
        run: python -m py_compile firmware/pico2_hx711/main.py
      - name: Smoke-test real native Qt window and capture screenshot
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "windows"
          python -c 'from PySide6.QtWidgets import QApplication; from PySide6.QtGui import QFontDatabase; app=QApplication([]); print("Native Qt Windows font families:", len(QFontDatabase.families()))'
          if ($LASTEXITCODE -ne 0) { throw "Native Windows Qt font preflight failed" }
          python launch_phasegate.py --smoke-test --screenshot build/PhaseGate-Native-Preview.png --screenshot-hardware build/PhaseGate-HardwareLab-Preview.png --screenshot-evidence build/PhaseGate-EvidenceLab-Preview.png --screenshot-optical build/PhaseGate-OpticalLab-Preview.png --screenshot-reference build/PhaseGate-ReferenceLab-Preview.png --screenshot-stations build/PhaseGate-StationMatrix-Preview.png --screenshot-build build/PhaseGate-Engineering-Preview.png --screenshot-inspection build/PhaseGate-FirstArticle-Preview.png --screenshot-assembly build/PhaseGate-AssemblyStudio-Preview.png
          if ($LASTEXITCODE -ne 0) { throw "Native Qt smoke test failed" }
          if (-not (Test-Path "build/PhaseGate-Native-Preview.png")) { throw "Missing home screenshot" }
          if (-not (Test-Path "build/PhaseGate-HardwareLab-Preview.png")) { throw "Missing native Hardware Lab screenshot" }
          if (-not (Test-Path "build/PhaseGate-EvidenceLab-Preview.png")) { throw "Missing native Evidence Lab screenshot" }
          if (-not (Test-Path "build/PhaseGate-OpticalLab-Preview.png")) { throw "Missing native Optical Lab screenshot" }
          if (-not (Test-Path "build/PhaseGate-ReferenceLab-Preview.png")) { throw "Missing native Reference Lab screenshot" }
          if (-not (Test-Path "build/PhaseGate-StationMatrix-Preview.png")) { throw "Missing redesigned Station Matrix screenshot" }
          if (-not (Test-Path "build/PhaseGate-Engineering-Preview.png")) { throw "Missing native Build Lab screenshot" }
          if (-not (Test-Path "build/PhaseGate-FirstArticle-Preview.png")) { throw "Missing native First Article screenshot" }
          if (-not (Test-Path "build/PhaseGate-AssemblyStudio-Preview.png")) { throw "Missing interactive Assembly Studio screenshot" }
      - name: Generate DPN PhaseGate Windows application icon
        run: python tools/generate_desktop_icon.py
      - name: Build a real standalone Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "DPN-PhaseGate" --icon "build/phasegate.ico" --add-data "data;data" launch_phasegate.py
          if ($LASTEXITCODE -ne 0) { throw "Windows EXE build failed" }
          if (-not (Test-Path "dist/DPN-PhaseGate.exe")) { throw "EXE not produced" }
          Get-Item "dist/DPN-PhaseGate.exe" | Select-Object Name,Length
      - name: Start and inspect the packaged EXE
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "windows"
          $exe = (Resolve-Path "dist/DPN-PhaseGate.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged EXE failed self-test: $($p.ExitCode)" }
      - name: Publish the downloadable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DPN-PhaseGate-Native-Windows-v1.6
          path: dist/DPN-PhaseGate.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish a screenshot of the actual Qt application
        uses: actions/upload-artifact@v4
        with:
          name: DPN-PhaseGate-Native-Preview-v1.6
          path: |
            build/PhaseGate-Native-Preview.png
            build/PhaseGate-HardwareLab-Preview.png
            build/PhaseGate-EvidenceLab-Preview.png
            build/PhaseGate-OpticalLab-Preview.png
            build/PhaseGate-ReferenceLab-Preview.png
            build/PhaseGate-StationMatrix-Preview.png
            build/PhaseGate-Engineering-Preview.png
            build/PhaseGate-FirstArticle-Preview.png
            build/PhaseGate-AssemblyStudio-Preview.png
          if-no-files-found: error
          retention-days: 30

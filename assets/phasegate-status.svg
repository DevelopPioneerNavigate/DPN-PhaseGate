<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 174" role="img" aria-labelledby="st sd">
<title id="st">DPN PhaseGate Research Status</title><desc id="sd">Three status cards distinguish the active literature program, the PG-01 paper-design stage and the absence of verified physical-object transfer.</desc>
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182441"/><stop offset="1" stop-color="#10192F"/></linearGradient></defs>
<rect width="1200" height="174" rx="18" fill="#0C1223"/>
<g font-family="Segoe UI,Arial,sans-serif">
<rect x="13" y="13" width="378" height="148" rx="13" fill="url(#card)" stroke="#3D587B"/>
<rect x="13" y="13" width="5" height="148" rx="2" fill="#42E0F0"/>
<text x="42" y="51" font-size="14" font-weight="700" letter-spacing="2" fill="#A4C7E1">01 / RESEARCH PROGRAM</text>
<text x="42" y="102" font-size="29" font-weight="750" fill="#ECF4FF">ACTIVE</text>
<text x="42" y="135" font-size="13" fill="#90AAC9">Cited literature and open questions</text>
<rect x="411" y="13" width="378" height="148" rx="13" fill="url(#card)" stroke="#4A486E"/>
<rect x="411" y="13" width="5" height="148" rx="2" fill="#9B73FA"/>
<text x="439" y="51" font-size="14" font-weight="700" letter-spacing="2" fill="#B7AEEC">02 / PG-01 STATIONS</text>
<text x="439" y="102" font-size="29" font-weight="750" fill="#ECF4FF">DESIGN STAGE</text>
<text x="439" y="135" font-size="13" fill="#A4A7CC">Measurement system, not a portal</text>
<rect x="809" y="13" width="378" height="148" rx="13" fill="url(#card)" stroke="#6D544F"/>
<rect x="809" y="13" width="5" height="148" rx="2" fill="#F2AF79"/>
<text x="837" y="51" font-size="14" font-weight="700" letter-spacing="2" fill="#F5CDAA">03 / MATTER TRANSFER</text>
<text x="837" y="102" font-size="29" font-weight="750" fill="#FFF2E8">UNVERIFIED</text>
<text x="837" y="135" font-size="13" fill="#C9AFA5">No observed physical-object transfer</text></g></svg>
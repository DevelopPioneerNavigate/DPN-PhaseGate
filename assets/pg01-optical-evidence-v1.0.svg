<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 460" role="img"><title>DPN PG-01 Optical Evidence Lab v1.0 — dual camera capture and uncertain host arrival clocks</title><desc>Camera A and Camera B feed independently consented local captures through a workstation, storing BENCH frame files with hashes and host receipt stamps. Never physical teleportation or verified clock synchronization.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111B35"/><stop offset="1" stop-color="#20143E"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B2F4F"/><stop offset="1" stop-color="#131C33"/></linearGradient></defs><rect width="1440" height="460" rx="22" fill="url(#bg)"/><g fill="#EFF6FF" font-family="Arial,sans-serif"><text x="38" y="47" font-size="25" font-weight="700">PHASEGATE / OPTICAL EVIDENCE LAB v1.0</text><text x="39" y="72" font-size="13" fill="#AFC5E7">OPERATOR-APPROVED USB CAMERAS • LOCAL JPEG EVIDENCE • HOST POST-READ TIMESTAMPS, NOT SENSOR EXPOSURE TIME</text></g><g stroke-width="2.2" fill="url(#panel)"><rect x="36" y="133" width="285" height="231" rx="16" stroke="#59DCEF"/><rect x="359" y="133" width="285" height="231" rx="16" stroke="#B18AFF"/><rect x="682" y="133" width="335" height="231" rx="16" stroke="#6D9FD6"/><rect x="1053" y="133" width="351" height="231" rx="16" stroke="#F6B985"/></g><g font-family="Arial,sans-serif"><text x="58" y="174" font-size="18" font-weight="700" fill="#E8FAFF">STATION A CAMERA</text><text x="381" y="174" font-size="18" font-weight="700" fill="#F2E5FF">STATION B CAMERA</text><text x="705" y="174" font-size="18" font-weight="700" fill="#EAF4FF">NATIVE WINDOWS LAB</text><text x="1074" y="174" font-size="18" font-weight="700" fill="#FFEBDD">EVIDENCE INTEGRITY</text><g font-size="15" fill="#B8CBE5"><text x="58" y="210">User opens preview</text><text x="58" y="240">JPEG frames on consent</text><text x="58" y="270">Post-read host timing</text><text x="58" y="317" fill="#5BE0F1">Physical index inspected</text><text x="381" y="210">Independently selected</text><text x="381" y="240">No auto-activation</text><text x="381" y="270">Not source-synced</text><text x="381" y="317" fill="#CFADFF">No causal timing claim</text><text x="705" y="210">OpenCV workers / Qt UI</text><text x="705" y="240">Operator clicks Record</text><text x="705" y="270">No cloud, audio or faces ID</text><text x="705" y="317" fill="#91E5FD">A/B preview + jitter flags</text><text x="1074" y="210">BENCH_OPTICAL_A / B</text><text x="1074" y="240">Frame JPG + SHA-256</text><text x="1074" y="270">Manifest + integrity check</text><text x="1074" y="317" fill="#FFD4AE">UNVERIFIED / NOT RUNS</text></g></g><g font-family="Arial,sans-serif" fill="#6DE7FF" text-anchor="middle" font-size="26"><text x="341" y="261">›</text><text x="662" y="261">›</text><text x="1035" y="261">›</text></g><rect x="38" y="387" width="1364" height="47" rx="12" fill="#33212B" stroke="#906476"/><text x="720" y="416" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFD1AD" text-anchor="middle">NO VERIFIED CAMERA SYNC • NO APPROVED EXPERIMENT • NO PHYSICAL OBJECT TRANSFER</text></svg>
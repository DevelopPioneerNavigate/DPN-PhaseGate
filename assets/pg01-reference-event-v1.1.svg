<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img"><title>PG-01 v1.1 reference flash timing analysis and evidence limits</title><desc>Two separate camera capture directories undergo hash checks, region brightness time series and independently bracketed host post-read flash-onset intervals. Unknown camera exposures are excluded from scientific claims.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081B31"/><stop offset="1" stop-color="#21153C"/></linearGradient><linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D2F50"/><stop offset="1" stop-color="#111F34"/></linearGradient></defs><rect width="1400" height="560" rx="26" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="38" y="52" fill="#F2F8FF" font-size="28" font-weight="bold">PG-01 / DUAL-REFERENCE LIGHT ANALYSIS</text><text x="38" y="80" fill="#AEC7E5" font-size="14">NATIVE OFFLINE OBSERVATION • HASH-VERIFIED BENCH FRAMES • HOST ARRIVAL ONLY</text></g><g fill="url(#box)" stroke-width="2"><rect x="35" y="122" width="282" height="248" rx="18" stroke="#56E0EE"/><rect x="343" y="122" width="283" height="248" rx="18" stroke="#BD8FFF"/><rect x="657" y="122" width="348" height="248" rx="18" stroke="#658FE0"/><rect x="1035" y="122" width="330" height="248" rx="18" stroke="#F4B782"/></g><g font-family="Arial,sans-serif"><text x="60" y="160" fill="#D4FAFF" font-size="17" font-weight="bold">01 / CAMERA A</text><text x="60" y="200" fill="#BECEE9" font-size="14">BENCH_OPTICAL_A</text><text x="60" y="231" fill="#BECEE9" font-size="14">Original JPEG + manifest</text><text x="60" y="263" fill="#BECEE9" font-size="14">SHA-256 checked first</text><text x="60" y="319" fill="#65E7F2" font-size="14">Brightness trace A</text><text x="366" y="160" fill="#F0DFFF" font-size="17" font-weight="bold">02 / CAMERA B</text><text x="366" y="200" fill="#BECEE9" font-size="14">BENCH_OPTICAL_B</text><text x="366" y="231" fill="#BECEE9" font-size="14">Original JPEG + manifest</text><text x="366" y="263" fill="#BECEE9" font-size="14">SHA-256 checked first</text><text x="366" y="319" fill="#C89FFF" font-size="14">Brightness trace B</text><text x="680" y="160" fill="#E7F3FF" font-size="17" font-weight="bold">03 / FLASH DETECTION</text><text x="680" y="202" fill="#BECEE9" font-size="14">5-frame background baseline</text><text x="680" y="231" fill="#BECEE9" font-size="14">Contrast + noise threshold</text><text x="680" y="260" fill="#BECEE9" font-size="14">Require sustained bright frames</text><text x="680" y="310" fill="#9BC2FF" font-size="14">Two POST-READ brackets</text><text x="1058" y="160" fill="#FFE2CC" font-size="17" font-weight="bold">04 / LIMITED REPORT</text><text x="1058" y="202" fill="#BECEE9" font-size="14">B minus A: host receipt</text><text x="1058" y="231" fill="#BECEE9" font-size="14">Δ interval with bounds</text><text x="1058" y="260" fill="#BECEE9" font-size="14">Unknown exposure / latency</text><text x="1058" y="310" fill="#F9C59B" font-size="14">BENCH_REFERENCE_*.json</text></g><g font-family="Arial,sans-serif" font-size="32" text-anchor="middle" fill="#75DDF3"><text x="329" y="260">›</text><text x="643" y="260">›</text><text x="1019" y="260">›</text></g><rect x="38" y="404" width="1324" height="92" rx="18" stroke="#915675" fill="#32212D"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="700" y="438" fill="#FFD6B3" font-size="18" font-weight="bold">HARD SCIENTIFIC BOUNDARY — NO VERIFIED EXPOSURE SYNCHRONIZATION</text><text x="700" y="465" fill="#C8AEC9" font-size="15">Matching bright frames are not proof of a shared event, object identity or matter transfer.</text></g><g font-family="Arial,sans-serif" fill="#91B5CF" font-size="11"><text x="40" y="536">DPN TECHNOLOGY • PG-01 • v1.1 RESEARCH SOFTWARE</text><text x="1359" y="536" text-anchor="end">DESIGN DRAWING • NOT A PHYSICAL APPARATUS</text></g></svg>
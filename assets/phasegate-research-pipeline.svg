<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img"><title>PG | Research workflow</title><desc>Preserve original evidence and report null results; synthetic data is never a real run.</desc><rect width="1200" height="310" rx="18" fill="#0C1429"/><rect x="12" y="12" width="1176" height="286" rx="11" fill="none" stroke="#48617D"/><text x="36" y="49" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#F0F6FF">PG | Research workflow</text><text x="37" y="75" font-size="12" font-family="Arial,sans-serif" fill="#A1B7D2">Preserve original evidence and report null results; synthetic data is never a real run.</text><rect x="24" y="132" width="187.83333333333334" height="134" rx="12" fill="#162440" stroke="#7D8DCF" stroke-width="2"/><text x="117.91666666666667" y="174" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#FFF7FF">SOURCES</text><text x="117.91666666666667" y="215" font-size="12" text-anchor="middle" font-family="Arial,sans-serif" fill="#AAC8E5">Primary literature</text><text x="219.83333333333334" y="210" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" fill="#53D8EE">›</text><rect x="221" y="132" width="187.83333333333334" height="134" rx="12" fill="#162440" stroke="#7D8DCF" stroke-width="2"/><text x="314.9166666666667" y="174" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#FFF7FF">HYPOTHESIS</text><text x="314.9166666666667" y="215" font-size="12" text-anchor="middle" font-family="Arial,sans-serif" fill="#AAC8E5">Falsifiable</text><text x="416.83333333333337" y="210" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" fill="#53D8EE">›</text><rect x="418" y="132" width="187.83333333333334" height="134" rx="12" fill="#162440" stroke="#7D8DCF" stroke-width="2"/><text x="511.9166666666667" y="174" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#FFF7FF">PROTOCOL</text><text x="511.9166666666667" y="215" font-size="12" text-anchor="middle" font-family="Arial,sans-serif" fill="#AAC8E5">Preregistered</text><text x="613.8333333333334" y="210" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" fill="#53D8EE">›</text><rect x="615" y="132" width="187.83333333333334" height="134" rx="12" fill="#162440" stroke="#7D8DCF" stroke-width="2"/><text x="708.9166666666666" y="174" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#FFF7FF">CALIBRATION</text><text x="708.9166666666666" y="215" font-size="12" text-anchor="middle" font-family="Arial,sans-serif" fill="#AAC8E5">Measured error</text><text x="810.8333333333334" y="210" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" fill="#53D8EE">›</text><rect x="812" y="132" width="187.83333333333334" height="134" rx="12" fill="#162440" stroke="#7D8DCF" stroke-width="2"/><text x="905.9166666666666" y="174" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#FFF7FF">REAL RUN</text><text x="905.9166666666666" y="215" font-size="12" text-anchor="middle" font-family="Arial,sans-serif" fill="#AAC8E5">Evidence hashes</text><text x="1007.8333333333334" y="210" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" fill="#53D8EE">›</text><rect x="1009" y="132" width="187.83333333333334" height="134" rx="12" fill="#33271F" stroke="#DFAD7E" stroke-width="2"/><text x="1102.9166666666667" y="174" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#FFF7FF">REVIEW</text><text x="1102.9166666666667" y="215" font-size="12" text-anchor="middle" font-family="Arial,sans-serif" fill="#AAC8E5">Independent</text></svg>
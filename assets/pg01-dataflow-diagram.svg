<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img"><title>PG-01 evidence and data integrity pipeline</title><desc>Instrumentation data flow from sensors to original files, checksums, independent review and actual-run manifest.</desc><rect width="1200" height="330" rx="20" fill="#0D1529"/><g font-family="Arial,sans-serif"><text x="35" y="48" fill="#EAF5FF" font-size="26" font-weight="bold">PG-01 // DATA AND EVIDENCE PIPELINE</text><text x="35" y="77" fill="#B1C6DE" font-size="13">Each arrow means information flow only. Synthetic demo records never enter the actual experiment manifest.</text></g><g fill="#172640" stroke="#62D9F0" stroke-width="2"><rect x="25" y="127" width="198" height="120" rx="14"/><rect x="262" y="127" width="198" height="120" rx="14"/><rect x="499" y="127" width="198" height="120" rx="14"/><rect x="736" y="127" width="198" height="120" rx="14"/><rect x="973" y="127" width="198" height="120" rx="14" stroke="#D5A176"/></g><g font-family="Arial,sans-serif" fill="#EFF6FF" font-size="18" font-weight="bold" text-anchor="middle"><text x="124" y="174">SENSORS</text><text x="361" y="174">RAW RECORDS</text><text x="598" y="174">FILE HASHES</text><text x="835" y="174">CONTROLS</text><text x="1072" y="174">MANIFEST</text></g><g font-family="Arial,sans-serif" fill="#AAC6E5" font-size="13" text-anchor="middle"><text x="124" y="204">mass / camera / UTC</text><text x="361" y="204">unaltered CSV + video</text><text x="598" y="204">SHA-256 references</text><text x="835" y="204">witness + uncertainty</text><text x="1072" y="204">reviewed real runs</text></g><g font-family="Arial,sans-serif" fill="#4BD4EB" font-size="30" text-anchor="middle"><text x="242" y="192">›</text><text x="479" y="192">›</text><text x="716" y="192">›</text><text x="953" y="192">›</text></g><text x="600" y="293" font-family="Arial,sans-serif" font-size="14" fill="#F0B88C" text-anchor="middle">No run is a discovery claim without rigorous physical controls and independent replication.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"><title>PG-01 top view and spatial separation</title><desc>Two separate inspectable station footprints and a center evidence console, linked only by data lines.</desc><rect width="1200" height="480" rx="20" fill="#0A2343"/><g fill="none" stroke="#70DDF6" stroke-width="3"><rect x="58" y="148" width="264" height="228" rx="5"/><rect x="880" y="148" width="264" height="228" rx="5"/><rect x="415" y="175" width="370" height="173" rx="12" stroke="#AB8AFF"/><circle cx="190" cy="262" r="66"/><circle cx="1012" cy="262" r="66"/><path d="M322 260H414M786 260H880" stroke-dasharray="9 7"/></g><g font-family="Arial,sans-serif" fill="#E4F4FF"><text x="45" y="51" font-size="27" font-weight="bold">PG-01 // TOP VIEW · SPATIAL SEPARATION</text><text x="46" y="80" font-size="14">Conceptual only | No dimensions approved | Dashed lines carry logged information, not objects.</text><text x="93" y="183" font-size="20">STATION A</text><text x="914" y="183" font-size="20">STATION B</text><text x="526" y="219" font-size="19">EVIDENCE CONSOLE</text><text x="455" y="263" font-size="17">Time sync / calibration</text><text x="467" y="294" font-size="17">Hash / witness review</text><text x="84" y="411" font-size="16" fill="#B0DFF0">Camera and mass-platform inspection</text><text x="868" y="411" font-size="16" fill="#CEBAFF">Independent camera / scale</text><text x="200" y="452" font-size="15" fill="#F5B58B">No concealed physical route, tube, moving bridge or sample-transfer pathway between stations.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img"><title>DPN PG-01 Calibration and Witness Evidence Architecture</title><desc>Detailed engineering visual separating live raw sensor readings, operator reference-mass calibration, independently recorded witness files and unverified local bench manifests from any scientific experiment.</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B2E50"/><stop offset="1" stop-color="#101C31"/></linearGradient></defs><rect width="1400" height="600" rx="22" fill="#091329"/><path d="M20 100H1380M20 510H1380" stroke="#2B476B"/><g font-family="Arial,sans-serif"><text x="48" y="54" fill="#EFF7FF" font-size="31" font-weight="700">PG-01 / INSTRUMENT METROLOGY + WITNESS CUSTODY</text><text x="49" y="83" fill="#9EBBDC" font-size="15">v0.8 conceptual research-data pathways   •   physical hardware not yet verified</text></g><g fill="url(#panel)" stroke-width="2"><rect x="48" y="145" width="282" height="265" rx="15" stroke="#49D9ED"/><rect x="389" y="145" width="282" height="265" rx="15" stroke="#B690FF"/><rect x="730" y="145" width="282" height="265" rx="15" stroke="#58BDDA"/><rect x="1071" y="145" width="282" height="265" rx="15" stroke="#E6AF7D"/></g><g font-family="Arial,sans-serif" fill="#ECF6FF"><text x="73" y="190" font-size="18" font-weight="700">01 / SENSOR STREAM</text><text x="73" y="227" font-size="16">Pico 2 + HX711 RAW</text><text x="73" y="258" font-size="15">signed 24-bit ADC counts</text><text x="73" y="288" font-size="15">sequence + host arrival</text><text x="73" y="318" font-size="15">frame fault flags</text><text x="73" y="363" font-size="14" fill="#73DCED">Never automatically grams</text><text x="414" y="190" font-size="18" font-weight="700">02 / CALIBRATION</text><text x="414" y="227" font-size="16">Reference-mass CSV</text><text x="414" y="258" font-size="15">linear fit + residuals</text><text x="414" y="288" font-size="15">station + range + expiry</text><text x="414" y="318" font-size="15">checksum of profile</text><text x="414" y="363" font-size="14" fill="#CBB3FF">UNREVIEWED estimate</text><text x="755" y="190" font-size="18" font-weight="700">03 / WITNESS FILES</text><text x="755" y="227" font-size="16">External video or photo</text><text x="755" y="258" font-size="15">operator / vantage note</text><text x="755" y="288" font-size="15">SHA-256 + file metadata</text><text x="755" y="318" font-size="15">no upload or copying</text><text x="755" y="363" font-size="14" fill="#7CCFE6">NOT source authentication</text><text x="1096" y="190" font-size="18" font-weight="700">04 / BENCH RECORD</text><text x="1096" y="227" font-size="16">BENCH_*.jsonl</text><text x="1096" y="258" font-size="15">raw original receipts</text><text x="1096" y="288" font-size="15">immutable file digest</text><text x="1096" y="318" font-size="15">separate from real runs</text><text x="1096" y="363" font-size="14" fill="#EAB989">NOT a physics result</text></g><g font-family="Arial,sans-serif" font-size="32" fill="#51DCEC" text-anchor="middle"><text x="359" y="285">›</text><text x="700" y="285">+</text><text x="1041" y="285">›</text></g><rect x="45" y="450" width="1308" height="80" rx="15" fill="#271E27" stroke="#775070"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="700" y="486" fill="#FFC898" font-size="20" font-weight="700">STOP GATE: NOT CERTIFIED   /   CLOCK OFFSET UNKNOWN   /   NO MATERIAL TRANSFER OBSERVED</text><text x="700" y="512" fill="#CFA8C8" font-size="14">Bench data cannot enter the approved experiment registry without independent safety, scientific and evidence review.</text></g><g font-family="Arial,sans-serif" font-size="12" fill="#90AEC8"><text x="45" y="566">DPN TECHNOLOGY   /   DEVELOP • PIONEER • NAVIGATE</text><text x="1354" y="566" text-anchor="end">ENGINEERING CONCEPT • NOT TO SCALE</text></g></svg>
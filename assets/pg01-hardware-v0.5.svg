<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" role="img"><title>PG-01 measurement hardware prototype block diagram</title><desc>Two independently instrumented proposed load-cell stations connect by USB to a local evidence computer. Camera hardware connects to the host PC separately. No physical transfer path exists.</desc><rect width="1280" height="450" rx="21" fill="#0c162b"/><rect x="16" y="16" width="1248" height="418" rx="14" fill="none" stroke="#3e597c"/><g font-family="Arial,sans-serif"><text x="35" y="51" font-size="27" font-weight="bold" fill="#f3f6ff">PG-01 / ELECTRONICS BLOCK DESIGN v0.5</text><text x="35" y="78" font-size="15" fill="#9dbbd8">Engineering concept | All components unpurchased and unassembled | USB is data, NOT a teleportation link</text></g><g fill="#132540" stroke-width="2"><rect x="28" y="127" width="356" height="253" rx="15" stroke="#42d9ed"/><rect x="463" y="127" width="356" height="253" rx="15" stroke="#ac85ff"/><rect x="897" y="127" width="355" height="253" rx="15" stroke="#6baac5"/></g><g font-family="Arial,sans-serif" fill="#eaf4ff" text-anchor="middle"><text x="206" y="169" font-size="23" font-weight="bold">STATION A</text><text x="641" y="169" font-size="23" font-weight="bold">STATION B</text><text x="1074" y="169" font-size="23" font-weight="bold">LOCAL PC</text><text x="206" y="212" font-size="17">5kg bar load cell</text><text x="206" y="244" font-size="17">SparkFun HX711 amplifier</text><text x="206" y="276" font-size="17">Raspberry Pi Pico 2</text><text x="641" y="212" font-size="17">5kg bar load cell</text><text x="641" y="244" font-size="17">SparkFun HX711 amplifier</text><text x="641" y="276" font-size="17">Raspberry Pi Pico 2</text><text x="1074" y="212" font-size="17">DPN Research Console</text><text x="1074" y="244" font-size="17">Optional USB cameras</text><text x="1074" y="276" font-size="17">Read-only demo v0.5</text><text x="206" y="338" font-size="14" fill="#91dfea">Future USB serial • pending</text><text x="641" y="338" font-size="14" fill="#d1b6ff">Future USB serial • pending</text><text x="1074" y="338" font-size="14" fill="#ffca99">NO PHYSICAL TELEPORTATION</text></g><path d="M384 313H450M819 313H885" stroke="#80d8ed" stroke-width="2.5" stroke-dasharray="7 7"/><g font-family="Arial,sans-serif" fill="#9ec0e1" font-size="12" text-anchor="middle"><text x="418" y="302">USB</text><text x="851" y="302">USB</text></g><text x="640" y="416" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#efb58b">Diagram is conceptual; not wired, powered, calibrated or tested.</text></svg>
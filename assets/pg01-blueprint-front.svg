<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img"><title>PG-01 front elevation engineering concept</title><desc>Concept drawing of an inspectable station enclosure, load-cell platform, camera, and separate low-voltage logger, dimensions pending.</desc><rect width="1200" height="560" rx="20" fill="#0A2343"/><g stroke="#194569" stroke-width="1" opacity=".65"><path d="M0 120H1200M0 200H1200M0 280H1200M0 360H1200M0 440H1200M120 0V560M240 0V560M360 0V560M480 0V560M600 0V560M720 0V560M840 0V560M960 0V560M1080 0V560"/></g><g fill="none" stroke="#85DFFF" stroke-width="3"><rect x="110" y="132" width="445" height="331" rx="4"/><rect x="140" y="170" width="385" height="230" rx="5"/><rect x="217" y="369" width="235" height="19"/><path d="M210 410H465"/><rect x="715" y="147" width="376" height="305" rx="10"/><rect x="767" y="188" width="266" height="75" rx="8"/><rect x="767" y="293" width="266" height="112" rx="8"/><path d="M555 250H714M555 385H714" stroke-dasharray="8 8"/></g><circle cx="333" cy="262" r="54" fill="none" stroke="#A482FF" stroke-width="4"/><circle cx="333" cy="262" r="17" fill="#172D52" stroke="#69E9FA"/><g fill="#E0F5FF" font-family="Arial,sans-serif"><text x="45" y="49" font-size="27" font-weight="bold">PG-01 // FRONT ELEVATION</text><text x="45" y="77" font-size="15">Blueprint concept | Not to scale | No teleportation mechanism | Fabrication measurements TBD</text><text x="147" y="150" font-size="17">TRANSPARENT INSPECTABLE ENCLOSURE</text><text x="221" y="358" font-size="16">MEASUREMENT PLATFORM</text><text x="258" y="258" font-size="13">CAMERA / VIEW</text><text x="760" y="175" font-size="20">LOCAL LOW-VOLTAGE LOGGER</text><text x="786" y="227" font-size="16">UTC CLOCK / STATUS PANEL</text><text x="788" y="328" font-size="16">ADC + sensor inputs</text><text x="788" y="359" font-size="16">Original data capture</text><text x="788" y="390" font-size="16">Disconnect + protection</text><text x="90" y="513" font-size="16" fill="#F4B88C">CONCEPT ONLY: dimensions, power, load limits and qualified safety review required before physical construction.</text></g></svg>
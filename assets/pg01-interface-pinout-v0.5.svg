<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img"><title>PG-01 proposed HX711-Pico digital pinout</title><desc>Signal-only candidate map of GPIO14 and GPIO15 for DOUT and SCK. Power pins intentionally unassigned pending safety review.</desc><rect width="1280" height="440" rx="22" fill="#0a2341"/><g font-family="Arial,sans-serif" fill="#edf7ff"><text x="38" y="54" font-size="28" font-weight="bold">PG-01 / PROPOSED SIGNAL-ONLY PIN MAP</text><text x="38" y="83" font-size="15" fill="#a9c6de">NO POWER WIRING APPROVED • Selected manufacturer module and 3.3 V logic must be checked first</text></g><g stroke-width="2" fill="#142d4d"><rect x="93" y="128" width="360" height="227" rx="14" stroke="#58d9eb"/><rect x="829" y="128" width="360" height="227" rx="14" stroke="#ae90f5"/></g><g font-family="Arial,sans-serif" fill="#edf7ff"><text x="144" y="170" font-size="23" font-weight="bold">HX711 AMPLIFIER</text><text x="886" y="170" font-size="23" font-weight="bold">RASPBERRY PI PICO 2</text><text x="148" y="227" font-size="21">DOUT / DAT</text><text x="147" y="288" font-size="21">CLK / SCK</text><text x="866" y="227" font-size="20">GP14 (physical pin 19)</text><text x="866" y="288" font-size="20">GP15 (physical pin 20)</text><text x="133" y="325" font-size="14" fill="#efb88c">Analog supply VCC: TBD</text><text x="853" y="325" font-size="14" fill="#efb88c">Power budget / GND: REVIEW</text></g><path d="M453 218H824M453 280H824" fill="none" stroke="#6fdff0" stroke-width="3" stroke-dasharray="9 7"/><g font-family="Arial,sans-serif" fill="#b7def6" text-anchor="middle"><text x="641" y="206" font-size="15">candidate digital data connection</text><text x="641" y="269" font-size="15">candidate digital clock connection</text><text x="640" y="404" font-size="16" fill="#f3b991">NO MODULE HOOKUP UNTIL SPLIT ANALOG VCC / DIGITAL VDD AND LEVEL LIMITS ARE VERIFIED</text></g></svg>